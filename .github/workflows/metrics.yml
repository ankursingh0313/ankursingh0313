name: Generate GitHub Metrics

on:
  # Runs every 12 hours automatically
  schedule: [{cron: "0 */12 * * *"}]
  # Allows manual runs from the Actions tab
  workflow_dispatch:
  # Triggers whenever you push changes to main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Tokyo-Night Infographic Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ankursingh0313
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # Styling matches Tokyo Night / Dark mode
          config_theme: tokyonight

          # Isometric 3D Calendar Plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding Habits Plugin (Active hours & days)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Language Details (Filters bloat, shows Kotlin, Java, C++, etc.)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Streaks & Contributions Plugin
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
