name: Generate GitHub Metrics

on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Clean Infographic Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ankursingh0313
          template: classic
          
          # Only include meaningful base stats (Hiding PRs, Issues, Sponsors, Releases, Packages, Forkers, Stargazers)
          base: header, activity, community, repositories
          base_skip: yes

          config_timezone: Asia/Kolkata
          config_order: base.header, isocalendar, languages

          # Isometric 3D Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages - directly displays the language bars without the broken "0 Languages" counter
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
